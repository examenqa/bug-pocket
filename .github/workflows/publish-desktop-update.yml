name: Publish Desktop Update

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      BUG_POCKET_UPDATES_BUCKET: bug-pocket-updates-v1
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish installer and update metadata
        run: npm run dist:publish

      - name: Verify public update manifest and installer
        env:
          BUG_POCKET_UPDATES_BUCKET: ${{ secrets.BUG_POCKET_UPDATES_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        shell: pwsh
        run: |
          $baseUrl = "https://$($env:BUG_POCKET_UPDATES_BUCKET).s3.$($env:AWS_REGION).amazonaws.com/windows"
          $manifestUrl = "$baseUrl/latest.yml?t=$([guid]::NewGuid())"

          Write-Host "Fetching manifest from: $manifestUrl"
          $response = Invoke-RestMethod -Uri $manifestUrl -ErrorAction Stop

          if ($response -notmatch "path:" -and $response -notmatch "files:") {
              throw "latest.yml does not contain a path or files.url entry. The Vercel /api/download proxy depends on this manifest."
          }
          Write-Host "Manifest verification passed."

