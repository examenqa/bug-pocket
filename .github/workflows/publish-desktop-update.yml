name: Publish Desktop Update

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      BUG_POCKET_UPDATES_BUCKET: bug-pocket-updates-v1
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish installer and update metadata
        run: npm run dist:publish

      - name: Verify public update manifest and installer
        shell: pwsh
        run: |
          $baseUrl = "https://$env:BUG_POCKET_UPDATES_BUCKET.s3.$env:AWS_REGION.amazonaws.com/windows"
          $manifestUrl = "$baseUrl/latest.yml"
          $manifest = Invoke-WebRequest -Uri $manifestUrl -UseBasicParsing -ErrorAction Stop
          $manifestText = $manifest.Content

          if (-not $manifestText) {
            throw "latest.yml was uploaded but is empty: $manifestUrl"
          }

          $pathMatch = [regex]::Match($manifestText, '(?m)^path:\s*(.+?)\s*$')
          if (-not $pathMatch.Success) {
            $pathMatch = [regex]::Match($manifestText, '(?m)^\s*-\s+url:\s*(.+?)\s*$')
          }
          if (-not $pathMatch.Success) {
            throw "latest.yml does not contain a path or files.url entry. The Vercel /api/download proxy depends on this manifest."
          }

          $installerPath = $pathMatch.Groups[1].Value.Trim().Trim('"', "'")
          if (-not $installerPath.EndsWith('.exe')) {
            throw "latest.yml points to an unexpected installer file: $installerPath"
          }

          $installerUrl = "$baseUrl/$installerPath"
          Invoke-WebRequest -Uri $installerUrl -Method Head -UseBasicParsing -ErrorAction Stop | Out-Null
          Write-Host "Verified latest.yml and installer at $installerUrl"

